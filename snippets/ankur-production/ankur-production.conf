# Production keeps firmware functionality but does not expose USB logging or
# the diagnostic shell.
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_SHELL=n
CONFIG_PRINTK=n

# Keep internal warnings/errors available to firmware modules without a
# production output backend.
CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=2
